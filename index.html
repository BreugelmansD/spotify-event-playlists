<!doctype html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Event Playlist Finder</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="topbar">
  <h1>🎧 Event Playlist Finder</h1>
  <button id="settingsBtn" class="btn btn-ghost">Instellingen</button>
</header>

<main>
  <section id="setupNotice" class="card notice hidden">
    <p>Je hebt nog geen API-adres ingesteld. Zie <strong>README.md</strong> voor de eenmalige setup (~10 minuten).</p>
    <label>API-adres (je Cloudflare Worker URL)</label>
    <input id="apiBaseInput" type="text" placeholder="https://spotify-event-proxy.jouwnaam.workers.dev" />

    <label style="margin-top:16px;">Minimum aantal volgers (filtert obscure/rommelige playlists eruit)</label>
    <input id="minFollowersInput" type="number" min="0" step="1000" placeholder="5000" />

    <button id="saveSettingsBtn" class="btn btn-primary" style="margin-top:16px;">Opslaan</button>
  </section>

  <section id="searchSection" class="card hidden">
    <h2>Wat voor evenement is het?</h2>
    <div id="categoryChips" class="chips"></div>

    <label class="field-label">Of typ zelf een thema/sfeer</label>
    <input id="themeInput" type="text" placeholder="bv. jaren 20 gala, kerstdiner, beachclub ibiza..." />

    <label class="field-label">Genre (optioneel)</label>
    <div id="genreChips" class="chips"></div>

    <label class="field-label">Energie</label>
    <div class="chips" id="energyChips">
      <button class="chip" data-energy="zeer_rustig">Heel rustig</button>
      <button class="chip" data-energy="rustig">Rustig achtergrond</button>
      <button class="chip" data-energy="gezellig">Gezellig</button>
      <button class="chip" data-energy="energiek">Energiek</button>
      <button class="chip" data-energy="dansbaar">Dansbaar / feest</button>
    </div>

    <button id="searchBtn" class="btn btn-primary btn-large">Zoek playlists</button>
  </section>

  <section id="statusArea" class="status hidden"></section>

  <section id="results" class="results-grid"></section>
</main>

<script src="app.js"></script>
</body>
</html>
