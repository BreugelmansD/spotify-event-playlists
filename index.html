<!doctype html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Event Playlist Finder</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="topbar">
  <h1>🎧 Event Playlist Finder</h1>
</header>

<main>
  <section id="searchSection" class="card">
    <h2>Wat voor evenement is het?</h2>
    <div id="categoryChips" class="chips"></div>

    <label class="field-label">Of typ zelf een thema/sfeer</label>
    <input id="themeInput" type="text" placeholder="bv. gala, kerstdiner, beachclub, piano..." />

    <label class="field-label">Genre (optioneel)</label>
    <div id="genreChips" class="chips"></div>

    <label class="field-label">Energie</label>
    <div id="energyChips" class="chips"></div>

    <label class="field-label">Minimale lengte playlist</label>
    <select id="minTracksSelect">
      <option value="0">Maakt niet uit</option>
      <option value="30">Minstens 30 nummers (~2 uur)</option>
      <option value="60">Minstens 60 nummers (~4 uur)</option>
      <option value="100">Minstens 100 nummers (~6 uur)</option>
    </select>

    <button id="searchBtn" class="btn btn-primary btn-large">Zoek playlists</button>
  </section>

  <section id="favoritesSection" class="card hidden">
    <div class="fav-header">
      <h2>⭐ Mijn shortlist</h2>
      <button id="copyFavsBtn" class="btn btn-ghost">Kopieer links</button>
    </div>
    <div id="favorites" class="fav-list"></div>
  </section>

  <section id="statusArea" class="status hidden"></section>

  <section id="results" class="results-grid"></section>

  <div class="more-wrap"><button id="moreBtn" class="btn btn-ghost hidden">Toon meer</button></div>
</main>

<script src="app.js"></script>
</body>
</html>
